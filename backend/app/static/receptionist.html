<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FortiSales AI - Autonomous Receptionist Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .chat-container { height: 420px; overflow-y: auto; background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; }
    .status-badge { font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="container py-4" style="max-width: 900px;">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
      <div>
        <h2 class="h4 mb-1 text-primary fw-bold">FortiSales AI — Receptionist Console</h2>
        <p class="text-muted small mb-0">Stage 4 Real-Time Voice Streaming & Autonomous Dialogue Engine</p>
      </div>
      <div class="d-flex gap-2">
        <span id="connection-status" class="badge bg-secondary p-2 status-badge">Disconnected</span>
        <span id="agent-state" class="badge bg-light text-dark p-2 status-badge">Offline</span>
      </div>
    </div>

    <!-- Error Banner -->
    <div id="error-banner" class="alert alert-danger d-none" role="alert"></div>

    <!-- Authentication Card -->
    <div class="card mb-3 shadow-sm border-0">
      <div class="card-body py-2">
        <label for="auth-token" class="form-label small fw-semibold text-muted mb-1">Staff Access Token (Bearer JWT)</label>
        <div class="input-group">
          <input type="password" id="auth-token" class="form-control font-monospace" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
          <button class="btn btn-outline-secondary" type="button" onclick="const el=document.getElementById('auth-token'); el.type = el.type === 'password' ? 'text' : 'password';">Show</button>
        </div>
      </div>
    </div>

    <!-- Call Control Toolbar -->
    <div class="card mb-3 shadow-sm border-0">
      <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div class="btn-group">
          <button id="btn-start" class="btn btn-success fw-semibold px-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-telephone-fill me-1" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z"/></svg>
            Start Call
          </button>
          <button id="btn-end" class="btn btn-danger fw-semibold px-4" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-telephone-x-fill me-1" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877zM11.146 5.146a.5.5 0 0 1 .708 0L13 6.293l1.146-1.147a.5.5 0 0 1 .708.708L13.707 7l1.147 1.146a.5.5 0 0 1-.708.708L13 7.707l-1.146 1.147a.5.5 0 0 1-.708-.708L12.293 7l-1.147-1.146a.5.5 0 0 1 0-.708"/></svg>
            End Call
          </button>
        </div>

        <div class="d-flex align-items-center gap-2">
          <button id="btn-mute" class="btn btn-outline-secondary">Mute Mic</button>
          <button id="btn-interrupt" class="btn btn-outline-warning text-dark">Interrupt AI (Barge-in)</button>
        </div>

        <div class="form-check form-switch ms-auto">
          <input class="form-check-input" type="checkbox" role="switch" id="recording-consent">
          <label class="form-check-label small fw-semibold" for="recording-consent">Recording Consent (Default: Off)</label>
        </div>
      </div>
    </div>

    <!-- Live Transcript Box -->
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
        <span class="fw-semibold text-secondary small">Live Speech Transcript & Dialogue Stream</span>
        <button class="btn btn-sm btn-link text-decoration-none p-0" onclick="document.getElementById('transcript-list').innerHTML='';">Clear</button>
      </div>
      <div id="transcript-list" class="card-body chat-container p-3">
        <div class="text-center text-muted small py-4">Click "Start Call" to open a real-time browser voice session.</div>
      </div>
    </div>
  </div>

  <script src="/static/receptionist.js"></script>
</body>
</html>
